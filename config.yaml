mlflow:
  tracking_uri: "http://127.0.0.1:5000"
  experiment_name: "adaptrank"
data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"

ranker:
  objective: "lambdarank"
  metric: "ndcg"
  ndcg_eval_at: [5, 10]
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 200
  min_data_in_leaf: 20
  lambda_l2: 0.1
  bagging_fraction: 0.9
  bagging_freq: 1
  label_gain: [0, 1, 3, 7]
  feature_cols:
    - sum_click
    - n_active_weeks
    - avg_click_per_week
    - days_active_span
    - num_of_prev_attempts
    - studied_credits
    - age_band_enc
    - highest_education_enc
    - disability_enc