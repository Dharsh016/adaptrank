mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "adaptrank-phase1"

data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"

ranker:
  objective: "lambdarank"
  metric: "ndcg"
  ndcg_eval_at: [5, 10]
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 200
  label_gain: [0, 1, 3, 7]
  