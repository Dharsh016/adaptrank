# docker-compose.yml

version: "3.9"

services:
  adaptrank-api:
    build: .
    container_name: adaptrank_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: adaptrank_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - adaptrank-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: adaptrank_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=adaptrank
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data: